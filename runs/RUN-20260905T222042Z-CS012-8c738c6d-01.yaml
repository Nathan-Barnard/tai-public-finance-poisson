repair:
  scope: bounded independent-review repair; no new implementation block
  issue_a:
    title: unbounded owner-root misclassification
    defect: >-
      solve_owner_root decided existence by searching 200 geometric doublings and
      returned no_interior_root_boundary_limit whenever no sign change was found.
      The search reached only about 1.6e60.
    counterexample:
      lambda_physical: 1
      lambda_risk_neutral: 1.0e-100
      payoff_jump: 1
      exact_root: 1e100 - 1
      before_repair: no_interior_root_boundary_limit, no exposure reported
      after_repair: unique_interior_root, exposure 1e+100, residual 0.0
    repair: >-
      Existence is decided analytically before any search by finite_root_exists,
      from strict monotonicity of D_owner plus its analytic limit
      -sum_j lambda_star_j J_j. The sign of D_owner(0) fixes the side; a finite
      endpoint on that side always gives a root because the residual diverges
      there, and an unbounded endpoint gives one exactly when the limit lies
      strictly beyond zero in the direction of travel. Bracketing then walks every
      FP64 binade to sys.float_info.max, so exhaustion proves unrepresentability
      rather than absence.
    new_status: finite_root_not_representable
    new_status_justification: >-
      The handoff's six statuses could not distinguish "no finite root exists"
      from "the finite root is unrepresentable in FP64", which is exactly how the
      defect hid. The reviewer required an explicit numerical refusal for the
      second case. Added as a documented deviation from the handoff's status list.
    preserved_true_negative: >-
      lambda_risk_neutral = 0 gives an analytic limit of exactly zero, so the
      strictly decreasing residual approaches zero without reaching it. It remains
      no_interior_root_boundary_limit.
    division_by_selected_payoff_component: >-
      None. The general multi-mark production route uses only the unmultiplied
      residual and the analytic limit; -1/J_j appears solely in the definition of
      the admissible interval for J_j != 0.
  issue_b:
    title: unreachable payoff-norm guard
    defect: >-
      project_fiscal_gap tested denominator < NORM_RESOLUTION_FLOOR * largest and
      documented it as a catastrophic-cancellation guard. The denominator is a sum
      of nonnegative weighted squares and is therefore never below its own largest
      term, so the branch was unreachable and the documentation was wrong: a sum
      of nonnegative terms cannot cancel.
    repair: >-
      The criterion and its NORM_RESOLUTION_FLOOR constant are removed, not
      retuned. A zero denominator is now split by exact zero-testing of the payoff
      components into a structurally zero payoff vector
      (zero_payoff_norm_refused) and an FP64 underflow of every weighted square
      with a structurally nonzero payoff vector
      (underflowed_payoff_norm_refused). No new absolute threshold was introduced
      and no payoff direction is normalized without a specified scale.
    status_rename: unresolved_payoff_norm_refused -> underflowed_payoff_norm_refused
    former_test_disposition: >-
      The test named "catastrophically cancelled payoff norm" was mislabelled; it
      exercised underflow. It is replaced by a test that asserts the arithmetic
      directly (each weighted square is exactly 0.0 while the payoff components are
      not, and the sum is never below its largest term over 500 seeded cases) and
      then pins the underflow status.
  status_contract_trim: >-
    ROOT_STATUSES and PROJECTION_STATUSES listed upstream kernel refusals that
    those functions raise rather than return. Those entries are removed, and each
    tuple is now covered by a test asserting that the observed status set equals
    the declared set.


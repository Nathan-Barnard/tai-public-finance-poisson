deviations:
  - id: DEV-01
    item: CLI module name and flags
    detail: >-
      The repository's CLAUDE.md scaffold convention is
      `python -m <package>.<subpackage>.cli --config ... --output-dir ... --run-id ...`.
      The CS012 I0 handoff freezes a different invocation:
      `python -m tai_public_finance.cs012_poisson_kernels.report --fixtures ... --output ...`.
      The handoff's frozen validation command was implemented verbatim, as the
      specification states that the implementation handoff freezes the exact
      repository validation commands. There is exactly one CLI in the package, in
      keeping with the repository's one-CLI-per-package rule. No mathematical or
      output contract was changed to fit an interface.
    resolution: implemented the handoff command; reported rather than silently reconciled
  - id: DEV-02
    item: PROJECT_STATUS.md absent
    detail: >-
      The collision gate names PROJECT_STATUS.md. This repository uses STATUS.md
      for the same purpose; CLAUDE.md, README.md, and STATUS.md were all read
      before writing. No PROJECT_STATUS.md exists here.
    resolution: read STATUS.md in its place; no file created
  - id: DEV-03
    item: package namespace
    detail: >-
      CLAUDE.md's pre-scaffold note suggested not reusing the `tai_public_finance`
      distribution name. The repository as actually scaffolded uses
      `src/tai_public_finance/cs005_marked_poisson/`, and the handoff assigns
      `src/tai_public_finance/cs012_poisson_kernels/`. The assigned path matches
      the existing layout, so no path mapping was needed.
    resolution: used the assigned path


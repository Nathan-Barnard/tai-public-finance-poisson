solver:
  packages_and_versions:
    scipy: 1.18.1
  method: >-
    Analytic kernel evaluation, closed-form residual sums with math.fsum, and
    scipy.optimize.brentq bracketing for the owner portfolio-pricing root. The
    bracket is found by geometric approach to an interval endpoint, strictly
    inside the open admissible interval, so no pole is evaluated; an unbounded
    endpoint uses the analytic limit -sum_j lambda_star_j J_j rather than a
    far-field probe.
  tolerances:
    brentq_xtol: 1.0e-15
    brentq_rtol: 8.881784197001252e-16
    wealth_route_agreement: 1.0e-12
    weighted_payoff_norm_resolution_floor: 1.0e-12
  initialization: zero exposure, which is always interior to a correctly constructed interval
  continuation: null
  precision: float64


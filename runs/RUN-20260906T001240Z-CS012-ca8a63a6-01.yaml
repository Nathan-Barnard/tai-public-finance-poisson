deviations:
  - id: DEV-01
    item: I1 executed before the full I1-I3 parameter packet is frozen
    standard_path_varied: >-
      CS012 v0.1 states that I1 waits for the complete I1-I3 parameter packet. This
      run executes I1 before the public-prefunding sequence, continuation horizon,
      terminal condition, and government-kernel thresholds are frozen.
    reason: >-
      None of those objects enters the I1 successor or owner-side calculation. The
      owner residual depends only on the physical and risk-neutral intensities, the
      marked payoff jumps, and owner wealth; the successors depend only on the
      technology, installation, and world-rate primitives.
    compensating_restriction: >-
      No government kernel, time path, portfolio direction, welfare, equilibrium, or
      optimal-policy result is produced. Government fields are absent by
      construction, not merely unreported.
    result_use_ceiling: exploratory_only
    owner: Nathan
    independent_reviewer: Codex
    expiry: before any I2 implementation or result run
  - id: DEV-02
    item: CLI module name
    detail: >-
      The block's CLI is report_i1 inside the existing cs012_poisson_kernels package,
      matching the handoff's frozen command exactly. This continues the I0 record's
      DEV-01 divergence from CLAUDE.md's scaffold convention
      (<package>.<subpackage>.cli with --config/--output-dir/--run-id). No
      mathematical or output contract was changed for interface convenience.
    resolution: reported, not silently reconciled
  - id: DEV-03
    item: unbounded exposure endpoint serialization repaired during implementation
    detail: >-
      The first draft emitted a non-standard JSON Infinity token for the lower
      boundary distance at the two diagnostic grid points where both payoffs are
      negative. That is the exact failure mode CS012 forbids for the laissez-faire
      boundary. It was found by the block's own finiteness test before any evidence
      was generated, and is now serialized as null plus an explicit unbounded flag,
      with the report written under allow_nan=False and a test that parses it back
      with a rejecting parse_constant.
    resolution: fixed inside the single implementation commit; no I0 code touched


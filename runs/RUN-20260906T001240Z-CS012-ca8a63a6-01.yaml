intended_use:
  control_lane: fast
  decisive_risk_dimensions:
    - correct successor branch selection with all rejected roots retained
    - exact marked payoff convention and mark labelling
    - owner pricing equation solved on the true positive-wealth interval
    - independent reconstruction of every owner-side quantity
    - containment of the government side out of an owner-side block
  claim_or_decision: >-
    Under one frozen provisional illustrative scenario, the two absorbing successors
    solve on their declared domains, the marked payoff jumps are of opposite sign,
    and the domestic log owner's exposure and pricing kernels follow from the
    unmultiplied owner FOC. No economic conclusion is drawn.
  quantities_of_interest:
    - selected q_F and every enumerated AK root with its rejection reason
    - partial stable manifold q_P(K) on the certified domain
    - marked payoff jumps J_P and J_F
    - owner exposure pi, wealth multipliers X^K_j, kernels k^w_j and k^K_j
    - mark-level and aggregate D_K
  declared_domain_or_branch: >-
    One provisional pre-arrival state (K_0=1, q_0=exp(varphi*delta), a_0=1) with zero
    public installed equity, zero public safe asset, zero public safe debt, zero
    source tax, and empty M_0 under the one-time-protection convention, plus a
    five-point diagnostic capital grid inside the certified partial domain.
  result_use_target: exploratory_only


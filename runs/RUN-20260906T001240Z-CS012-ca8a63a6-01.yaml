    and Lambert-W cross-checks; partial successor by backward IVP from a linearised
    offset with an independent two-point collocation comparison; owner exposure by
    the reviewed CS012 I0 analytic-existence test plus scipy brentq on the
    unmultiplied owner FOC over the open positive-wealth interval.
  precision: float64


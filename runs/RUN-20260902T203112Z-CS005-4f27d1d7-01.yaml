solver:
  packages_and_versions:
    numpy: 2.5.2
    scipy: 1.18.1
  method: 'Post-mark: two one-sided scipy.integrate.solve_ivp (DOP853) shooting solves
    in (u=log(k/k*), v=log(q/q*)) continuation coordinates from the first-order stable
    expansion, with domain expansion on demand. Pre-arrival: algebraic elimination
    (affine-polynomial construction, not hand-expanded) for the private-portfolio
    quadratic, the public-saving/exposure linear-plus-quadratic system, and the cleared
    debt-boundary KKT polynomial; the scalar capital residual K(k) is then searched
    on a log-spaced grid per branch slot, with pole-aware bracket rejection and manual
    (non-scipy) bisection refinement -- a reduced-coverage search relative to CS005''s
    full Chebyshev/Sobol multi-start protocol (see prearrival_solver.py''s module
    docstring).'
  tolerances:
    independent_tolerance: 1.0e-08
    solver_tolerance: 1.0e-10
  initialization: First-order stable-manifold expansion at the anchor; log-spaced
    k-grid for candidate search.
  continuation: Domain expansion by one log unit (capped at |u|=8) when an accepted
    root is within 0.25 log units of the post-mark graph's edge.
  precision: float64
preflight:
  tests_command: uv run pytest

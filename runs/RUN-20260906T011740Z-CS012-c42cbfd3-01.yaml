parameter_change:
  base_packet: P-CS012-ECO-01
  new_packet: P-CS012-ECO-02
  operative_difference_is_exactly:
    - packet_id
    - technology.A_bar
  A_bar_before: 0.10
  A_bar_after: 0.10329029481590953
  derivation: >-
    Provisional illustrative parameter choice, derived and not measured. Fixing a
    target full-AK capital growth g_F = 0.026 per year gives the stationary AK price
    q_F = exp[varphi*(g_F + delta)] = 1.2943388186242377; inverting the zero-tax
    world-user-cost equation gives A_bar = q_F*(r_F_bar - g_F) + (q_F - 1)/varphi =
    0.10329029481590953. Nothing about g_F = 0.026 is estimated. It is chosen so the
    full-AK mark raises installed-equity value rather than lowering it, the case
    ECO-01 does not exhibit.
  unchanged_primitives_confirmed_by_test: >-
    A test walks both packets' operative direct fields and asserts the only
    differences are packet_id and technology.A_bar. varphi=3.0, delta=0.06,
    (r_0_bar,r_P_bar,r_F_bar)=(0.025,0.030,0.030), both task shares, Z, the whole
    shock law, the inherited state and balance sheets, the successor domains, and the
    diagnostic grid are all identical.
  loader_change: >-
    The loader recognized one hard-coded economic packet id and now recognizes a
    closed, enumerated set of two. It is a set, not a pattern: P-CS012-ECO-03, a
    lowercase variant, a whitespace-padded variant and five other misspellings are
    all still refused, and eight malformed-packet structural checks were re-tested to
    show none was weakened.
  fingerprints:
    P-CS012-ECO-01: 7524e29731dcfe46d6e18d6e129f72b0bbd8f7c4d7374b20c7e03b06b7fc4c2f
    P-CS012-ECO-02: 2d792f4843a8024517c267cc551f2008eb86ecf1a6e7d6fc9906b0093e100568


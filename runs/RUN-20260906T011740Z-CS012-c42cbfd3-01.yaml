interpretation:
  supports_result_ids: []
  challenges_result_ids: []
  question_ids: [Q24]
  assurance_or_review_artifacts: [EV13]
  conclusion: >-
    Changing one primitive, full-AK productivity, from 0.10 to 0.10329029481590953
    moves full-AK growth above partial growth, turns both marked payoffs positive, and
    reverses the domestic owner's optimal exposure from a levered long position of
    +11.02 to an interior short position of -4.79, with both wealth multipliers strictly
    positive and the owner pricing equation satisfied to 4.3e-19 normalized residual. The
    AK block still enumerates two roots and accepts only the lower strict-TVC branch.
    This is an owner-side pricing calculation under a provisional illustrative scenario,
    not an economic conclusion.
  limitations:
    - Both scenarios are provisional and illustrative; neither is an estimate or a country calibration, and the pair is a two-point comparison of one primitive, not a range.
    - The pre-arrival state is a named provisional state, not a solved equilibrium.
    - No government kernel, fiscal marginal value, prefunding path, time path, portfolio direction, welfare number, or optimal policy exists at I1.
    - The owner exposure satisfies the stated owner pricing equation and wealth conditions at this state; it is not an optimal government portfolio and must never be described as one.
    - The synthetic subsection is quarantined for a known provenance defect and supports nothing.
    - The checker does not re-derive the partial stable manifold; that evidence comes from the pinned dependency.
    - CS012 v0.1 remains a draft, neither review-ready nor approved.
  next_decision: >-
    Independent review by Codex. Before I2: repair the P-CS012-SYN-01 stationary-compatible
    mischaracterization, and freeze the strictly positive public-prefunding sequence with
    its stopping threshold and accounting treatment, the continuation horizon and terminal
    condition, and the quantity-specific government-kernel thresholds.
  integration_owner: Nathan
  review_state: ready for independent review
  accepted: false

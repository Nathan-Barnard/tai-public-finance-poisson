      P-CS012-SYN-01 describes the dependency fixture manufactured-two-mark as
      stationary-compatible. The pinned CS011 commit describes that fixture's state as
      an arbitrary probe, not an equilibrium point, and no genuinely
      manufactured-stationary-compatible fixture exists at that commit. The packet's
      characterization is therefore wrong.
    disposition: >-
      Not repaired or reinterpreted in this task. No claim of any kind is made on the
      synthetic subsection of this run. Its three fixtures did each reproduce at the
      pinned commit, but that fact is recorded as quarantined and supports nothing.
    repair_trigger: bundled with I2; must be closed before any I2 result run
    containment_evidence:
      structural: >-
        report_i1._economic_scenario takes only (packet, tolerances). Its source
        contains no reference to the synthetic packet, any fixture, or get_fixture. A
        test asserts both the signature and the absence of those names.
      behavioural: >-
        A test rebuilds the whole ECO-02 report against a second synthetic packet
        naming a different primary fixture and a different regression set, confirms the
        synthetic subsections differ, and asserts the economic subsections are
        byte-identical under sorted-key serialization.
      conclusion: >-
        The ECO-02 economic section is independent of the selected synthetic fixture.
        Containment is demonstrated, so evidence generation was permitted.


closure_audit:
  pre_event_mu_e_status: unavailable_missing_optimized_pre_event_value_gradient
  government_kernels_permitted: false
  method: >-
    Read-only programmatic introspection of the installed pinned dependency, not an
    asserted conclusion.
  evidence:
    - >-
      ak_partial_ramsey.canonical supplies the four-dimensional pre-arrival costate
      system for z = (K, e, mu_K, mu_e) as EQUATIONS only; its own module docstring
      states that solving the transition boundary-value problem is block N4 and is
      deliberately not implemented there.
    - >-
      Every mu_e-aware callable in that module accepts mu_e as a caller-supplied
      argument and none returns one: consumption_growth, control_map_residual,
      costate_e_dot, costate_K_dot, tax_recovery_residual.
    - >-
      ak_partial_ramsey.assembly.evaluate_state requires pre-event consumption C and
      the price drift q_dot as caller-supplied inputs, so the only mu_e it could
      express is 1/C at a supplied C, which is a fixed-policy derivative.
    - ak_partial_ramsey.stationary, .continuation and .certificate are absent at the pinned commit.
  candidate_rejected:
    candidate: mu_e = 1/C from the interior consumption first-order condition
    why_rejected: >-
      C would have to come from a solved optimized pre-arrival continuation. Supplying
      it by hand makes the object a fixed-policy derivative. CS012 requires the
      derivative of the OPTIMIZED government continuation and states it is "not the
      derivative of a rule that mechanically fixes all laissez-faire policies after a
      marginal resource arrives".
  forbidden_substitutes_not_used:
    - mu_e = 1 as a normalization
    - 1/C_0 or 1/W_0 without a solved optimized continuation
    - the owner kernel
    - the world kernel
    - a fixed-policy value derivative
    - a value from an unpinned or unapproved dependency revision
    - a newly invented pre-event equation, terminal condition, or policy rule
  missing_computational_object: >-
    mu_e(K_0, e_0): the gradient in public net wealth of the optimized pre-event
    government continuation value on the maintained zero-tax admissible branch, with its
    boundary/terminal conditions and TVCs.
  missing_interface: >-
    A solved pre-arrival transition (CS011 block N4) returning the converged costate pair
    (mu_K, mu_e) at the reference state, with the branch, terminal condition and TVC
    certificates under which it was solved.
  dependency_pin_change_considered: false
  consequence: >-
    No finite k^G and no gamma are reported. The literal full-AK divergence is still
    classified structurally as +infinity under CS012's maintained finite-positive
    pre-event mu_e branch, which is a boundary classification and NOT a normalized
    finite kernel.


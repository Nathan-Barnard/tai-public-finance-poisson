  conclusion: >-
    I2a passed. Full automation eliminates worker human wealth, so its successor
    marginal value diverges like 1/F with an exactly unit log-log elasticity and is
    structurally non-finite at F = 0. Partial automation retains positive worker human
    wealth at this baseline, so its successor marginal value has a finite limit near
    5.1365 and its elasticity approaches zero. SYN-02 supplies a genuinely
    stationary-compatible analytic benchmark to replace SYN-01's false label. No
    optimized pre-event mu_e exists at the pinned commits, so no normalized government
    kernel and no gamma were computed.
  limitations:
    - Successor-side boundary evidence only; a successor marginal value is not a government kernel.
    - No normalized k^G, no gamma, no portfolio direction, no welfare, no equilibrium claim, no optimal policy.
    - The prefunding rows are different inherited continuations, not welfare-comparable to one another.
    - The economic packet is provisional and illustrative, not an estimate or a country calibration.
    - The partial branch's finite limit is a property of this baseline K_0 = 1; it is not a general result.
    - SYN-02 has no economic interpretation and is not a two-mark scenario.
    - CS012 v0.1 remains a draft, neither review-ready nor approved.
  next_decision: >-

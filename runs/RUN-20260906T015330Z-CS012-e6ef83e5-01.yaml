    mu_e(K_0, e_0) from a solved pre-arrival transition (CS011 block N4) with its branch,
    terminal condition and TVC certificates. That is a CS011 deliverable and a new
    dependency pin, not a CS012 edit; nothing else in I2 can advance without it.
  integration_owner: Nathan
  review_state: ready for independent review
  accepted: false

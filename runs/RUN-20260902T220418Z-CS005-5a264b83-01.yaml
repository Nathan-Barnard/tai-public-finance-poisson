  conclusion: 'First real prototype / reduced-coverage computational pass, not a decision-grade
    CS005 pass (spec draft; PM08 tail/transversality at CS005 tolerance: True; W5
    strict viability checked via certified-inner/outer bounds; W2/W3/W4 out of scope):
    computation completed cleanly (4 candidates enumerated, all independent checks
    passed at high precision); no candidate satisfies every admissibility condition
    (tax bounds, positive consumption, transfer floor, debt sign, private solvency,
    specialization, certified W5 strict viability) simultaneously under this profile
    and reduced-coverage search. This is a substantive finding, not a computational
    failure. W5 strict-viability labels: 1 certified_viable, 2 frontier_unresolved,
    1 certified_infeasible_on_declared_domain. 1 candidate(s) pass every pre-W5 implemented
    check (admissible_ex_w5); ''admissible'' additionally requires a certified_viable
    W5 label. A frontier_unresolved label is a certification gap of the constant-tax
    lower-bound witness, not evidence of fiscal infeasibility.'
  limitations:
  - 'Draft specification (CS005 v0.7): every result is proof-assurance stage S0_unassessed;
    a numerical root is a candidate, not evidence of existence, uniqueness, global
    optimality, or equilibrium.'
  - 'Reduced-coverage root search: one log-spaced k-grid per branch slot (interior
    x2, boundary x2, private-portfolio x2) with pole-aware bracket rejection and bisection
    refinement -- not CS005''s full 513/1025-node Chebyshev, 64-Sobol-start, iterative
    box/domain-doubling coverage-certification protocol. Branch-slot identity is sorted-order-based,
    not continuation-tracked, so a bifurcation could in principle hide or double-count
    a root.'
  - 'PM08 tail/transversality: the decisive certificate is backward true-time integration
    from a local linear tail attached at |u|=1e-3 using the numerically-built Jacobian
    eigendecomposition (diagnostics.certify_postmark_tail; per-mark method, attachment
    point, saddle-path exclusion bound, manifold-match residual, tolerance, and pass/fail
    reported in pm08_certificates). It certifies the tail/transversality property
    on the certified [k_min, k_max] domain only, with a LINEARIZED contraction bound
    for the off-manifold exclusion -- not a computer-assisted proof. The original
    forward-shooting diagnostic is retained as a warning-level indicator (pm08_* fields
    in postmark_diagnostics); its large projections reflect forward saddle-path shooting
    instability, not evidence against q_j(k).'
  - PR06 (the scalar capital residual K(k)) is independently re-implemented from the
    same displayed reduced formula (fresh code, different intermediate structuring)
    plus finite-difference verification of every partial-derivative term, not from
    a from-scratch unreduced costate/investment-FOC pair -- CS005's four authorized
    source documents supply only the reduced K(k), not that pair, for this profile.
  - 'W5 strict viability is checked CONSERVATIVELY, not closed: the branch-specific
    lower frontier underline_f_j(k, ell) = -C_j(k, ell) is bracketed between a certified-inner
    capacity lower bound (constant-tax continuations on the rescaled certified zero-tax
    stable manifold -- a RESTRICTED control family, no time-varying tax front-loading
    or collocation, witness PV independently re-integrated in the u-coordinate at
    four-times-finer tolerance) and CS005''s coarse tau=1 compact-domain outer bound
    on the declared (possibly expanded) k-domain. Labels are certified_viable (f_j^+
    above -C_lower with a 1e-6*H_ref margin, every supported mark), certified_infeasible_on_declared_domain
    (f_j^+ below -C_upper for some mark), or frontier_unresolved -- the last is a
    certification gap, never an infeasibility finding, per CS005''s rule that W5 may
    not classify a candidate infeasible from failure to find a path. The lower/upper
    capacity gap is NOT within CS005''s 1e-4 closing tolerance, so no claimed frontier
    is reported and CS005''s full I5 collocation/mesh/horizon refinement protocol
    remains outstanding. The witness respects the profile''s frozen tax bounds [tau_min,
    tau_max] (tighter than the spec''s 0<=tau<=1, hence conservative for the inner
    bound); the outer bound uses tau=1 (conservative for infeasibility). Successor
    protected-value/branch consistency is imposed only through the tau-consistent
    smooth stable-manifold selection (price label smooth_zero_tax_stable_manifold_branch);
    alternative capacity concepts (sdf_value, expected_physical, defaultable) are
    separate experiments, not computed here.'
  - Candidate-level 'admissible' now REQUIRES a certified_viable W5 label in addition
    to every previously implemented check; 'admissible_ex_w5' preserves the pre-W5
    meaning. A candidate that is admissible_ex_w5 but frontier_unresolved is neither
    certified viable nor refuted.
  - W2 (two-tranche capital-income-strip/residual-equity rank), W3 (direct tax-path
    price-response cone), W4 (fixed-mark diagnostic), a global transition, and a closed-economy
    version are all explicitly out of scope for this pass.
  - The provisional profile P-CS005-REAL-01 is a judgement calibration (EMP005), not
    a source-versioned empirical estimate -- report every economic quantity as a first
    real attempt, not a decision-grade magnitude.
  - gamma_a (private-wealth stationarity compatibility) is reported per candidate,
    not enforced -- a nonzero value means the candidate is a conditional real-fiscal
    policy rest point rather than a full domestic balanced-growth path, per the model
    doc's own framing; this is not treated as a failure.
  - 'Codex-side registry note: CP005 has no bound implementation_repository entry
    as of this run; this record names the repository, commit, and branch explicitly
    per the fallback convention until that binding is made.'
  next_decision: Report back to Nathan for independent review before attempting the
    two-tranche (W2), tax-span (W3), and fixed-mark (W4) blocks, and before closing
